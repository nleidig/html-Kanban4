databases:
  - name: kanban-db
    plan: free
    databaseName: kanban
    user: kanban

services:
  - type: web
    name: kanban-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kanban-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        value: https://kanban-client.onrender.com

  - type: web
    name: kanban-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://kanban-server.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
